name: Build Delivery Stock iPhone IPA (Apple Signed)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-delivery-stock-ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Check Apple signing configuration
        shell: bash
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERT_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$CERT" || -z "$CERT_PASS" || -z "$PROFILE" || -z "$TEAM" ]]; then
            echo '::error::iOS IPA requires Apple signing secrets: APPLE_CERTIFICATE_P12_BASE64, APPLE_CERTIFICATE_PASSWORD, APPLE_PROVISIONING_PROFILE_BASE64, APPLE_TEAM_ID'
            exit 1
          fi

      - name: Setup XcodeGen
        run: brew install xcodegen

      - name: Generate Delivery Stock iOS project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ios-delivery-stock
          mkdir -p "$(dirname "ios-delivery-stock/Assets.xcassets/AppIcon.appiconset/Contents.json")"
          cat > 'ios-delivery-stock/Assets.xcassets/AppIcon.appiconset/Contents.json' <<'__DS_IOS_EOF_3__'
          {
            "images": [
              {
                "filename": "app_icon_1024.png",
                "idiom": "universal",
                "platform": "ios",
                "size": "1024x1024"
              }
            ],
            "info": {
              "author": "xcode",
              "version": 1
            }
          }
          __DS_IOS_EOF_3__
          mkdir -p "$(dirname "ios-delivery-stock/Assets.xcassets/AppIcon.appiconset/app_icon_1024.png")"
          printf '%s' '' | base64 --decode > 'ios-delivery-stock/Assets.xcassets/AppIcon.appiconset/app_icon_1024.png'
          mkdir -p "$(dirname "ios-delivery-stock/Sources/DeliveryStockApp.swift")"
          cat > 'ios-delivery-stock/Sources/DeliveryStockApp.swift' <<'__DS_IOS_EOF_22__'
          import SwiftUI
          
          @main
          struct DeliveryStockApp: App {
              var body: some Scene {
                  WindowGroup { DeliveryWebView() }
              }
          }
          __DS_IOS_EOF_22__
          mkdir -p "$(dirname "ios-delivery-stock/Sources/DeliveryWebView.swift")"
          cat > 'ios-delivery-stock/Sources/DeliveryWebView.swift' <<'__DS_IOS_EOF_33__'
          import SwiftUI
          import WebKit
          
          struct DeliveryWebView: UIViewRepresentable {
              private let startURL = URL(string: "http://103.41.207.63/delivery/media.php?module=rpt_stock_new")!
              func makeUIView(context: Context) -> WKWebView {
                  let cfg = WKWebViewConfiguration()
                  cfg.websiteDataStore = .default() // cookie persetujuan perangkat tetap tersimpan
                  cfg.defaultWebpagePreferences.allowsContentJavaScript = true
                  let webView = WKWebView(frame: .zero, configuration: cfg)
                  webView.navigationDelegate = context.coordinator
                  webView.uiDelegate = context.coordinator
                  webView.scrollView.contentInsetAdjustmentBehavior = .never
                  webView.load(URLRequest(url: startURL))
                  return webView
              }
              func updateUIView(_ uiView: WKWebView, context: Context) {}
              func makeCoordinator() -> Coordinator { Coordinator(host: startURL.host ?? "") }
              final class Coordinator: NSObject, WKNavigationDelegate, WKUIDelegate {
                  let host: String
                  init(host: String) { self.host = host }
                  func webView(_ webView: WKWebView, decidePolicyFor navigationAction: WKNavigationAction,
                               decisionHandler: @escaping (WKNavigationActionPolicy) -> Void) {
                      guard let url = navigationAction.request.url else { decisionHandler(.cancel); return }
                      if url.host == host || url.scheme == "about" { decisionHandler(.allow); return }
                      if let scheme = url.scheme, ["http", "https", "mailto", "tel"].contains(scheme) {
                          UIApplication.shared.open(url)
                      }
                      decisionHandler(.cancel)
                  }
                  func webView(_ webView: WKWebView, createWebViewWith configuration: WKWebViewConfiguration,
                               for navigationAction: WKNavigationAction,
                               windowFeatures: WKWindowFeatures) -> WKWebView? {
                      if navigationAction.targetFrame == nil, let url = navigationAction.request.url {
                          if url.host == host { webView.load(URLRequest(url: url)) }
                          else { UIApplication.shared.open(url) }
                      }
                      return nil
                  }
              }
          }
          __DS_IOS_EOF_33__
          mkdir -p "$(dirname "ios-delivery-stock/project.yml")"
          cat > 'ios-delivery-stock/project.yml' <<'__DS_IOS_EOF_77__'
          name: DeliveryStockIOS
          options:
            bundleIdPrefix: id.co.elmecon
          settings:
            base:
              IPHONEOS_DEPLOYMENT_TARGET: '15.0'
              SWIFT_VERSION: '5.0'
              TARGETED_DEVICE_FAMILY: '1,2'
          targets:
            DeliveryStockIOS:
              type: application
              platform: iOS
              deploymentTarget: '15.0'
              sources:
                - path: Sources
                - path: Assets.xcassets
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: id.co.elmecon.deliverystock
                  INFOPLIST_KEY_CFBundleDisplayName: Delivery Stock
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
              info:
                path: Info.plist
                properties:
                  CFBundleDisplayName: Delivery Stock
                  UILaunchScreen: {}
                  NSAppTransportSecurity:
                    NSAllowsArbitraryLoads: true # SEMENTARA: HTTP IP. Hapus setelah pakai HTTPS.
          __DS_IOS_EOF_77__

      - name: Import Apple signing certificate and provisioning profile
        shell: bash
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERT_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/signing.mobileprovision"
          security create-keychain -p "${{ github.run_id }}-delivery-stock" delivery-build.keychain
          security default-keychain -s delivery-build.keychain
          security unlock-keychain -p "${{ github.run_id }}-delivery-stock" delivery-build.keychain
          security set-keychain-settings -lut 3600 delivery-build.keychain
          security import "$RUNNER_TEMP/signing.p12" -k delivery-build.keychain -P "$CERT_PASS" -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "${{ github.run_id }}-delivery-stock" delivery-build.keychain
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$RUNNER_TEMP/signing.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          cp "$RUNNER_TEMP/signing.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Build and archive signed iPhone app
        shell: bash
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cd ios-delivery-stock
          xcodegen generate
          xcodebuild -project DeliveryStockIOS.xcodeproj -scheme DeliveryStockIOS -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/DeliveryStock.xcarchive" archive CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" CODE_SIGN_IDENTITY='Apple Distribution'

      - name: Export IPA (Ad Hoc)
        shell: bash
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>ad-hoc</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM</string>
            <key>provisioningProfiles</key><dict>
              <key>id.co.elmecon.deliverystock</key><string>$PROFILE_NAME</string>
            </dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/DeliveryStock.xcarchive" -exportPath "$RUNNER_TEMP/delivery-export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          mkdir -p delivery-ios-artifacts
          cp "$RUNNER_TEMP/delivery-export/DeliveryStockIOS.ipa" 'delivery-ios-artifacts/DeliveryStock-v1.0.0-iPhone.ipa'
          cd delivery-ios-artifacts
          shasum -a 256 DeliveryStock-v1.0.0-iPhone.ipa > SHA256SUMS.txt

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: DeliveryStock-v1.0.0-iPhone-IPA
          path: delivery-ios-artifacts/
          retention-days: 30
          if-no-files-found: error
