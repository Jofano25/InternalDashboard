name: Build Delivery Stock Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-delivery-stock-android.yml'

permissions:
  contents: read

jobs:
  build-delivery-stock:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout (tanpa mengubah source EMOS)
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Generate Delivery Stock Android project (self-contained)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery-stock-android
          mkdir -p "$(dirname "delivery-stock-android/app/build.gradle")"
          cat > 'delivery-stock-android/app/build.gradle' <<'__DELIVERY_STOCK_EOF_3__'
          plugins { id 'com.android.application' }
          
          def keystorePath = System.getenv('DELIVERY_KEYSTORE_PATH')
          android {
              namespace 'id.co.elmecon.deliverystock'
              compileSdk 35
              defaultConfig {
                  applicationId 'id.co.elmecon.deliverystock'
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName '1.0.0'
              }
              signingConfigs {
                  if (keystorePath != null && !keystorePath.isEmpty()) {
                      deliveryRelease {
                          storeFile file(keystorePath)
                          storePassword System.getenv('DELIVERY_KEYSTORE_PASSWORD')
                          keyAlias System.getenv('DELIVERY_KEY_ALIAS')
                          keyPassword System.getenv('DELIVERY_KEY_PASSWORD')
                      }
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      if (keystorePath != null && !keystorePath.isEmpty()) {
                          signingConfig signingConfigs.deliveryRelease
                      }
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          __DELIVERY_STOCK_EOF_3__
          mkdir -p "$(dirname "delivery-stock-android/app/src/main/AndroidManifest.xml")"
          cat > 'delivery-stock-android/app/src/main/AndroidManifest.xml' <<'__DELIVERY_STOCK_EOF_42__'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:label="Delivery Stock"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:allowBackup="false"
                  android:supportsRtl="true">
                  <!-- usesCleartextTraffic=true HANYA untuk URL http:// saat ini. Ganti ke false setelah HTTPS aktif. -->
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          __DELIVERY_STOCK_EOF_42__
          mkdir -p "$(dirname "delivery-stock-android/app/src/main/java/id/co/elmecon/deliverystock/MainActivity.java")"
          cat > 'delivery-stock-android/app/src/main/java/id/co/elmecon/deliverystock/MainActivity.java' <<'__DELIVERY_STOCK_EOF_64__'
          package id.co.elmecon.deliverystock;
          
          import android.app.Activity;
          import android.app.DownloadManager;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.view.View;
          import android.webkit.CookieManager;
          import android.webkit.URLUtil;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.Toast;
          import android.graphics.Color;
          
          public final class MainActivity extends Activity {
              private static final String START_URL = "http://103.41.207.63/delivery/media.php?module=rpt_stock_new";
              private static final String ALLOWED_HOST = "103.41.207.63";
              private static final int FILE_CHOOSER_REQUEST = 7123;
              private WebView webView;
              private ProgressBar progress;
              private ValueCallback<Uri[]> fileCallback;
          
              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().setStatusBarColor(Color.rgb(10, 35, 61));
                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setBackgroundColor(Color.WHITE);
                  progress = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  progress.setMax(100);
                  layout.addView(progress, new LinearLayout.LayoutParams(-1, 3));
                  webView = new WebView(this);
                  layout.addView(webView, new LinearLayout.LayoutParams(-1, 0, 1));
                  setContentView(layout);
          
                  webView.getSettings().setJavaScriptEnabled(true); // dibutuhkan jika laporan menggunakan JS/DataTables
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.getSettings().setAllowFileAccess(false);
                  webView.getSettings().setAllowContentAccess(true);
                  webView.getSettings().setSupportMultipleWindows(false);
                  webView.getSettings().setJavaScriptCanOpenWindowsAutomatically(false);
                  webView.getSettings().setBuiltInZoomControls(true);
                  webView.getSettings().setDisplayZoomControls(false);
                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, false);
          
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override public void onProgressChanged(WebView view, int newProgress) {
                          progress.setProgress(newProgress);
                          progress.setVisibility(newProgress >= 100 ? View.GONE : View.VISIBLE);
                      }
                      @Override public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (fileCallback != null) fileCallback.onReceiveValue(null);
                          fileCallback = callback;
                          try { startActivityForResult(params.createIntent(), FILE_CHOOSER_REQUEST); return true; }
                          catch (ActivityNotFoundException e) { fileCallback = null; return false; }
                      }
                  });
                  webView.setWebViewClient(new WebViewClient() {
                      @Override public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          if (("http".equals(uri.getScheme()) || "https".equals(uri.getScheme()))
                                  && ALLOWED_HOST.equalsIgnoreCase(uri.getHost())) return false;
                          try { startActivity(new Intent(Intent.ACTION_VIEW, uri)); }
                          catch (Exception e) { Toast.makeText(MainActivity.this, "Tidak dapat membuka tautan", Toast.LENGTH_LONG).show(); }
                          return true;
                      }
                      @Override public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                          if (request.isForMainFrame()) Toast.makeText(MainActivity.this,
                                  "Gagal terhubung. Periksa jaringan / alamat server.", Toast.LENGTH_LONG).show();
                      }
                  });
                  webView.setDownloadListener((url, userAgent, contentDisposition, mimeType, contentLength) -> {
                      if (!(url.startsWith("http://") || url.startsWith("https://"))) {
                          Toast.makeText(this, "Unduhan jenis ini belum didukung", Toast.LENGTH_LONG).show(); return;
                      }
                      try {
                          DownloadManager.Request request = new DownloadManager.Request(Uri.parse(url));
                          request.addRequestHeader("User-Agent", userAgent);
                          String cookies = CookieManager.getInstance().getCookie(url);
                          if (cookies != null) request.addRequestHeader("Cookie", cookies);
                          String filename = URLUtil.guessFileName(url, contentDisposition, mimeType);
                          request.setTitle(filename);
                          request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                          request.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, filename);
                          ((DownloadManager)getSystemService(DOWNLOAD_SERVICE)).enqueue(request);
                          Toast.makeText(this, "Mengunduh ke folder Downloads", Toast.LENGTH_SHORT).show();
                      } catch (Exception e) { Toast.makeText(this, "Unduhan gagal dimulai", Toast.LENGTH_LONG).show(); }
                  });
                  if (state == null) webView.loadUrl(START_URL); else webView.restoreState(state);
              }
              @Override protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == FILE_CHOOSER_REQUEST && fileCallback != null) {
                      fileCallback.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, data));
                      fileCallback = null;
                  }
              }
              @Override public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack(); else super.onBackPressed();
              }
              @Override protected void onSaveInstanceState(Bundle out) {
                  if (webView != null) webView.saveState(out);
                  super.onSaveInstanceState(out);
              }
              @Override protected void onDestroy() {
                  if (webView != null) { webView.destroy(); webView = null; }
                  super.onDestroy();
              }
          }
          __DELIVERY_STOCK_EOF_64__
          mkdir -p "$(dirname "delivery-stock-android/app/src/main/res/drawable/launcher_foreground.xml")"
          cat > 'delivery-stock-android/app/src/main/res/drawable/launcher_foreground.xml' <<'__DELIVERY_STOCK_EOF_186__'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#27D5CE" android:pathData="M28,28 L80,28 L80,79 L28,79 Z"/>
              <path android:fillColor="#0B263F" android:pathData="M36,38 L49,38 Q63,38 63,53 Q63,68 49,68 L36,68 Z"/>
              <path android:fillColor="#27D5CE" android:pathData="M43,44 L49,44 Q56,44 56,53 Q56,62 49,62 L43,62 Z"/>
              <path android:fillColor="#0B263F" android:pathData="M65,38 L73,38 L73,44 L65,44 Z M65,49 L73,49 L73,55 L65,55 Z M65,60 L73,60 L73,68 L65,68 Z"/>
          </vector>
          __DELIVERY_STOCK_EOF_186__
          mkdir -p "$(dirname "delivery-stock-android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml")"
          cat > 'delivery-stock-android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml' <<'__DELIVERY_STOCK_EOF_195__'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/launcher_background"/>
              <foreground android:drawable="@drawable/launcher_foreground"/>
          </adaptive-icon>
          __DELIVERY_STOCK_EOF_195__
          mkdir -p "$(dirname "delivery-stock-android/app/src/main/res/mipmap-hdpi/ic_launcher.png")"
          printf '%s' '' | base64 --decode > 'delivery-stock-android/app/src/main/res/mipmap-hdpi/ic_launcher.png'
          mkdir -p "$(dirname "delivery-stock-android/app/src/main/res/mipmap-mdpi/ic_launcher.png")"
          printf '%s' '' | base64 --decode > 'delivery-stock-android/app/src/main/res/mipmap-mdpi/ic_launcher.png'
          mkdir -p "$(dirname "delivery-stock-android/app/src/main/res/mipmap-xhdpi/ic_launcher.png")"
          printf '%s' '' | base64 --decode > 'delivery-stock-android/app/src/main/res/mipmap-xhdpi/ic_launcher.png'
          mkdir -p "$(dirname "delivery-stock-android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png")"
          printf '%s' '' | base64 --decode > 'delivery-stock-android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png'
          mkdir -p "$(dirname "delivery-stock-android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png")"
          printf '%s' '' | base64 --decode > 'delivery-stock-android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png'
          mkdir -p "$(dirname "delivery-stock-android/app/src/main/res/values/colors.xml")"
          cat > 'delivery-stock-android/app/src/main/res/values/colors.xml' <<'__DELIVERY_STOCK_EOF_213__'
          <resources><color name="launcher_background">#0B263F</color></resources>
          __DELIVERY_STOCK_EOF_213__
          mkdir -p "$(dirname "delivery-stock-android/build.gradle")"
          cat > 'delivery-stock-android/build.gradle' <<'__DELIVERY_STOCK_EOF_217__'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          __DELIVERY_STOCK_EOF_217__
          mkdir -p "$(dirname "delivery-stock-android/gradle.properties")"
          cat > 'delivery-stock-android/gradle.properties' <<'__DELIVERY_STOCK_EOF_223__'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          __DELIVERY_STOCK_EOF_223__
          mkdir -p "$(dirname "delivery-stock-android/settings.gradle")"
          cat > 'delivery-stock-android/settings.gradle' <<'__DELIVERY_STOCK_EOF_228__'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'DeliveryStockAndroid'
          include ':app'
          __DELIVERY_STOCK_EOF_228__

      - name: Optional stable release signing
        id: signing
        shell: bash
        env:
          STORE_B64: ${{ secrets.DELIVERY_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.DELIVERY_KEYSTORE_PASSWORD }}
          STORE_ALIAS: ${{ secrets.DELIVERY_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.DELIVERY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$STORE_B64" && -n "$STORE_PASS" && -n "$STORE_ALIAS" && -n "$KEY_PASS" ]]; then
            printf '%s' "$STORE_B64" | base64 --decode > "$RUNNER_TEMP/delivery-release.jks"
            echo 'release_signed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'release_signed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        shell: bash
        env:
          DELIVERY_KEYSTORE_PASSWORD: ${{ secrets.DELIVERY_KEYSTORE_PASSWORD }}
          DELIVERY_KEY_ALIAS: ${{ secrets.DELIVERY_KEY_ALIAS }}
          DELIVERY_KEY_PASSWORD: ${{ secrets.DELIVERY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd delivery-stock-android
          if [[ '${{ steps.signing.outputs.release_signed }}' == 'true' ]]; then
            export DELIVERY_KEYSTORE_PATH="$RUNNER_TEMP/delivery-release.jks"
            gradle --no-daemon :app:assembleRelease
            source_apk='app/build/outputs/apk/release/app-release.apk'
            sign_type='RELEASE (stable keystore from GitHub Secrets)'
          else
            gradle --no-daemon :app:assembleDebug
            source_apk='app/build/outputs/apk/debug/app-debug.apk'
            sign_type='DEBUG (for initial installation; key may change between builds)'
          fi
          test -s "$source_apk"
          mkdir -p "${{ github.workspace }}/delivery-artifacts"
          cp "$source_apk" "${{ github.workspace }}/delivery-artifacts/DeliveryStock-v1.0.0-Android.apk"
          cd "${{ github.workspace }}/delivery-artifacts"
          sha256sum DeliveryStock-v1.0.0-Android.apk > SHA256SUMS.txt
          printf 'Application: Delivery Stock\nVersion: 1.0.0\nSigning: %s\nURL: http://103.41.207.63/delivery/media.php?module=rpt_stock_new\nDevice approval requires installation of server backend and guards.\n' "$sign_type" > BUILD_INFO.txt

      - name: Upload installer APK
        uses: actions/upload-artifact@v4
        with:
          name: DeliveryStock-v1.0.0-Android-APK
          path: delivery-artifacts/
          retention-days: 30
          if-no-files-found: error
