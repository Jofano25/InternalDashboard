name: Build Delivery Stock Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-delivery-stock-android.yml'
      - 'android-source/**'

permissions:
  contents: read

jobs:
  build-delivery-stock:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # The GitHub-hosted ubuntu-24.04 runner already includes Android SDK
      # command-line tools. Do not use android-actions/setup-android@v3 here:
      # its old default 'tools' package is no longer available.
      - name: Install Android SDK 35 (preinstalled sdkmanager)
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "Android sdkmanager not found at $SDKMANAGER" >&2
            exit 1
          fi
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
          echo "SDK installation complete"

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f android-source/settings.gradle
          test -f android-source/build.gradle
          test -f android-source/app/build.gradle
          test -f android-source/app/src/main/AndroidManifest.xml
          gradle --version

      - name: Build installable Android APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android-source :app:assembleDebug --no-daemon --stacktrace
          mkdir -p output
          cp android-source/app/build/outputs/apk/debug/app-debug.apk output/DeliveryStock-v1.0.0-Android.apk
          ls -lh output/*.apk

      - name: Upload Android APK installer
        uses: actions/upload-artifact@v4
        with:
          name: DeliveryStock-v1.0.0-Android-APK
          path: output/*.apk
          if-no-files-found: error
          retention-days: 30
