<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ELMECON STOCK</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#172b43;font:16px system-ui,sans-serif}header{background:#0b2946;color:white;padding:25px 20px}header strong{font-size:23px;letter-spacing:1px}header small{display:block;color:#c5d8e9;margin-top:6px}main{max-width:660px;margin:auto;padding:18px 16px 80px}section,article{background:white;border:1px solid #dae3ec;border-radius:16px;padding:17px;margin-bottom:12px}h2{margin:0 0 12px;font-size:20px}label{display:block;font-size:13px;font-weight:650;margin:12px 0 6px}input,select,button{width:100%;padding:13px;border-radius:10px;font:inherit}input,select{border:1px solid #bac9d8;background:white}button{border:0;background:#0b65a5;color:white;font-weight:650;margin-top:12px}button:disabled{opacity:.55}#message{color:#41566c;margin:8px 0 16px;white-space:pre-wrap}article strong{overflow-wrap:anywhere}article small{display:block;color:#63768a;margin:5px 0 10px}article b{font-size:24px;color:#09644f}footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dae3ec;text-align:center;padding:14px;font-size:12px;color:#62758a}[hidden]{display:none!important}</style></head><body><header><strong>ELMECON STOCK</strong><small>Internal application · V2.0</small></header><main><div id="message" role="status">Memeriksa perangkat…</div>
<section id="register" hidden><h2>Device Registration</h2><form id="regForm"><label for="name">Nama pengguna</label><input id="name" required maxlength="100" autocomplete="off"><label for="code">Kode aktivasi</label><input id="code" required maxlength="40" autocomplete="off"><button>Daftarkan perangkat</button></form></section>
<section id="waiting" hidden><h2 id="stateTitle">Device Status</h2><button id="retry">Periksa kembali</button></section>
<div id="stock" hidden><section><h2>Report Stock</h2><form id="searchForm"><label for="q">Cari produk / part number</label><input id="q" required minlength="2" maxlength="100" autocomplete="off"><label for="price">Price list</label><select id="price" required><option value="">Pilih price list</option></select><button>Cari produk</button></form></section><div id="results"></div></div></main><footer>Delivery Stock · Device Authorization</footer>
<script>
const el=id=>document.getElementById(id);let active=false,busy=false,requestId=0,previousLists="",priceVisible=true,owner="";function show(id){['register','waiting','stock'].forEach(x=>el(x).hidden=x!==id)}function lock(message){active=false;el('results').replaceChildren();show('waiting');el('stateTitle').textContent='Akses belum tersedia';el('message').textContent=message}function send(action,data={}){if(busy)return;busy=true;document.querySelectorAll('button').forEach(x=>x.disabled=true);let msg=JSON.stringify({id:++requestId,action,data});try{if(window.Native)Native.request(msg);else if(window.webkit?.messageHandlers?.device)window.webkit.messageHandlers.device.postMessage(msg);else throw Error('Aplikasi native diperlukan')}catch(e){receive({id:requestId,error:String(e)})}}
function text(parent,tag,value){let n=document.createElement(tag);n.textContent=value??'';parent.append(n);return n}
function receive(r){if(r.id!==requestId)return;busy=false;document.querySelectorAll('button').forEach(x=>x.disabled=false);if(r.error){lock(r.error);return}let d=r.data||{};if(d.status!=='active'){active=false;el('results').replaceChildren();if(d.status==='unregistered'){show('register');el('message').textContent=d.message||'Perangkat belum terdaftar.'}else{show('waiting');el('stateTitle').textContent=({pending:'Menunggu approval',blocked:'Perangkat diblokir',disabled:'Mobile access dinonaktifkan',update_required:'Update aplikasi diperlukan'})[d.status]||'Akses belum tersedia';el('message').textContent=d.message||'Hubungi administrator.'}return}active=true;show('stock');if(typeof d.owner==='string')owner=d.owner;if(typeof d.price_visible==='boolean'&&d.price_visible!==priceVisible){priceVisible=d.price_visible;el('results').replaceChildren();}if(Array.isArray(d.price_lists)){const next=JSON.stringify(d.price_lists);if(next!==previousLists){let selected=el('price').value;el('price').replaceChildren(new Option('Pilih price list',''));for(const list of d.price_lists)el('price').add(new Option(list,list));if(d.price_lists.includes(selected))el('price').value=selected;else if(d.price_lists.length===1)el('price').value=d.price_lists[0];if(previousLists!==next)el('results').replaceChildren();previousLists=next;}}el('message').textContent=(d.message||'Device authorized')+(owner?' · '+owner:'');if(Array.isArray(d.items)){el('results').replaceChildren();if(!d.items.length)text(el('results'),'p','Produk tidak ditemukan.');for(let item of d.items){let card=document.createElement('article');text(card,'strong',item.product);text(card,'small',[item.code,item.brand,item.classification].filter(Boolean).join(' · '));text(card,'small','Stock Elmecon');text(card,'b',String(item.stock??0)+' pcs');if(item.price!=null){let detail=document.createElement('details');text(detail,'summary','Lihat harga');text(detail,'p',new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:2}).format(Number(item.price)));card.append(detail)}el('results').append(card)}}}
el('regForm').onsubmit=e=>{e.preventDefault();send('register',{name:el('name').value,code:el('code').value});el('code').value=''};el('searchForm').onsubmit=e=>{e.preventDefault();if(active){el('results').replaceChildren();send('stock',{q:el('q').value,price_list:el('price').value})}};el('price').onchange=()=>el('results').replaceChildren();el('retry').onclick=()=>send('status');document.addEventListener('visibilitychange',()=>{el('results').replaceChildren();if(!document.hidden){lock('Memeriksa akses…');send('status')}});setInterval(()=>{if(!document.hidden)send('status')},30000);send('status');
</script></body></html>
