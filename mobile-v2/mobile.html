<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ELMECON STOCK</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{background:#eef3f8;color:#18334b;font:14px system-ui,sans-serif;display:flex;flex-direction:column}header{flex:none;background:#0b2946;color:white;padding:13px 14px}header strong{font-size:19px;letter-spacing:.7px}header small{display:block;color:#c4d9e9;font-size:11px;margin-top:3px}main{width:100%;max-width:1000px;margin:auto;min-height:0;flex:1;display:flex;flex-direction:column;padding:8px 10px 10px;gap:7px}#message{flex:none;font-size:12px;color:#435d73;overflow-wrap:anywhere;max-height:52px;overflow:auto}section{background:#fff;border:1px solid #d9e4ef;border-radius:12px;padding:14px;overflow:auto}h2{margin:0 0 10px;font-size:18px}label{display:block;font-size:12px;font-weight:650;margin:10px 0 5px}input,select,button{border-radius:8px;font:inherit;min-width:0}input,select{border:1px solid #bfcede;background:#fff;color:#18334b;padding:9px;width:100%;font-size:16px}button{border:0;background:#17649a;color:white;padding:9px 12px;font-weight:650;cursor:pointer}button:disabled{opacity:.45;cursor:default}.wide{width:100%;margin-top:12px}.secondary{background:#eef4fa;color:#184c75;border:1px solid #c5d7e7}.muted{font-size:12px;color:#62788d}#catalog{display:flex;flex:1;flex-direction:column;min-height:0;background:white;border:1px solid #d9e4ef;border-radius:12px;overflow:hidden}.catalog-head{display:flex;flex:none;gap:8px;align-items:center;padding:9px 10px;background:#f7fafe;border-bottom:1px solid #dce6ef}.catalog-head div{flex:1;min-width:0}.catalog-head strong{display:block;font-size:14px;overflow-wrap:anywhere}.catalog-head button{font-size:12px;flex:none}.tools{flex:none;display:flex;align-items:center;gap:8px;padding:8px 10px}.tools input{flex:1;width:0}.tools select{width:auto;max-width:86px;font-size:13px}.tools label{margin:0;font-size:11px;white-space:nowrap}.viewport{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;border-top:1px solid #e2e8ef;position:relative}table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}th{position:sticky;top:0;z-index:1;text-align:left;padding:9px 8px;background:#dbe7f2;font-size:12px;color:#183b5b}td{padding:10px 8px;border-bottom:1px solid #e7edf4;vertical-align:middle;overflow-wrap:anywhere}td strong{display:block;font-size:13px}td small{display:block;font-size:11px;color:#60768b;margin-top:3px}td.num,th.num{text-align:right}td.num{font-weight:750;font-variant-numeric:tabular-nums;color:#086349}td.price{color:#173f65;font-size:12px;font-variant-numeric:tabular-nums}tr:nth-child(even) td{background:#f8fafc}.empty{text-align:center;color:#65798d;padding:25px 8px}.pager{flex:none;border-top:1px solid #dbe5ee;padding:8px 10px max(8px,env(safe-area-inset-bottom));background:#fff;display:grid;gap:6px}.pager .nav{display:flex;gap:6px;align-items:center;justify-content:space-between}.nav button{padding:7px 11px;min-height:34px}.nav span{font-size:12px;font-weight:650;text-align:center}.pager small{text-align:center;color:#5a7186;font-size:11px}.pricecol{width:29%}.stockcol{width:19%}#catalog.no-price .pricecol,#catalog.no-price .price{display:none}#catalog.no-price .stockcol{width:25%}[hidden]{display:none!important}@media(max-height:460px){header{padding:6px 12px}header small{display:none}main{padding:4px;gap:3px}.catalog-head,.tools,.pager{padding:4px 6px}.pager{gap:2px}}
</style></head><body><header><strong>ELMECON STOCK</strong><small>Delivery Stock · V2.1</small></header><main><div id="message" role="status">Memeriksa perangkat…</div>
<section id="register" hidden><h2>Device Registration</h2><form id="regForm"><label for="name">Nama pengguna</label><input id="name" required maxlength="100" autocomplete="off"><label for="code">Kode aktivasi</label><input id="code" required maxlength="40" autocomplete="off"><button class="wide">Daftarkan perangkat</button></form></section>
<section id="waiting" hidden><h2 id="stateTitle">Device Status</h2><button id="retry" class="wide">Periksa kembali</button></section>
<section id="choose" hidden><h2>Pilih Pricelist</h2><p class="muted">Pilih daftar harga untuk membuka semua produk yang diizinkan.</p><form id="priceForm"><label for="price">Pricelist</label><select id="price" required><option value="">Pilih pricelist</option></select><button class="wide" id="openList">OK · Tampilkan Produk</button></form></section>
<div id="catalog" hidden><div class="catalog-head"><div><span class="muted">Pricelist aktif</span><strong id="selectedList"></strong></div><button id="changeList" class="secondary">Ganti</button></div><div class="tools"><input id="q" type="search" placeholder="Search produk / kode" aria-label="Search produk atau kode barang" maxlength="100" autocomplete="off"><label for="size">Show</label><select id="size" aria-label="Jumlah produk per halaman"><option>10</option><option>25</option><option>50</option></select></div><div class="viewport" id="viewport"><table aria-label="Report Stock"><thead><tr><th>Produk / Kode</th><th class="num stockcol">Stok</th><th class="num pricecol">Harga</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pager"><small id="info">Memuat produk…</small><div class="nav"><button id="first" class="secondary" aria-label="Halaman pertama">«</button><button id="prev" class="secondary">Prev</button><span id="page">1 / 1</span><button id="next" class="secondary">Next</button><button id="last" class="secondary" aria-label="Halaman terakhir">»</button></div></div></div></main>
<script>
const el=id=>document.getElementById(id);const views=['register','waiting','choose','catalog'];let active=false,busy=false,requestId=0,requestAction='',sentEpoch=0,epoch=0,owner='',allowed=[],priceVisible=false,selected='',page=1,pages=1,total=0,timer=null,pendingStock=false,needsStatus=false;
function show(id){views.forEach(x=>el(x).hidden=x!==id)}
function text(p,t,v,c){let n=document.createElement(t);n.textContent=v??'';if(c)n.className=c;p.append(n);return n}
function clearRows(msg=''){el('rows').replaceChildren();if(msg){let tr=el('rows').insertRow();let td=tr.insertCell();td.colSpan=priceVisible?3:2;td.className='empty';td.textContent=msg;}el('info').textContent=msg||'';}
function nav(){el('page').textContent=page+' / '+pages;el('first').disabled=el('prev').disabled=busy||page<=1;el('next').disabled=el('last').disabled=busy||page>=pages;}
function lock(message){active=false;selected='';allowed=[];owner='';priceVisible=false;el('q').value='';pendingStock=false;needsStatus=false;clearTimeout(timer);epoch++;clearRows();show('waiting');el('stateTitle').textContent='Akses belum tersedia';el('message').textContent=message;}
function send(action,data={}){if(busy)return;busy=true;requestAction=action;sentEpoch=epoch;el('openList').disabled=true;el('retry').disabled=true;el('regForm').querySelector('button').disabled=true;nav();const msg=JSON.stringify({id:++requestId,action,data});try{if(window.Native)Native.request(msg);else if(window.webkit?.messageHandlers?.device)window.webkit.messageHandlers.device.postMessage(msg);else throw Error('Aplikasi native diperlukan');}catch(e){receive({id:requestId,error:String(e)});}}
function flush(){if(busy||document.hidden)return;if(needsStatus){needsStatus=false;send('status');return;}if(pendingStock&&active&&selected){pendingStock=false;send('stock',{q:el('q').value,price_list:selected,page,page_size:Number(el('size').value)});}}
function load(p){if(!active||!selected)return;page=Math.max(1,p);epoch++;pendingStock=true;clearRows('Memuat produk…');nav();flush();}
function pick(){epoch++;pendingStock=false;selected='';page=pages=1;total=0;el('q').value='';clearRows();show('choose');}
function updateLists(lists){const current=el('price').value;el('price').replaceChildren(new Option('Pilih pricelist',''));for(const item of lists)el('price').add(new Option(item,item));if(lists.includes(current))el('price').value=current;else if(lists.length===1)el('price').value=lists[0];el('openList').disabled=!lists.length;}
function receive(r){if(r.id!==requestId)return;busy=false;el('retry').disabled=false;el('regForm').querySelector('button').disabled=false;el('openList').disabled=!allowed.length;nav();if(document.hidden){clearRows();return;}if(needsStatus&&requestAction==='stock'&&sentEpoch!==epoch){flush();return;}if(r.error){lock(r.error);return;}const d=r.data||{};if(d.status!=='active'){lock(d.message||'Hubungi administrator.');if(d.status==='unregistered'){show('register');el('message').textContent=d.message||'Perangkat belum terdaftar.';}else{el('stateTitle').textContent=({pending:'Menunggu approval',blocked:'Perangkat diblokir',disabled:'Mobile access dinonaktifkan',update_required:'Update aplikasi diperlukan'})[d.status]||'Akses belum tersedia';}return;}
const priorOwner=owner,priorPrice=priceVisible,priorLists=JSON.stringify(allowed);active=true;if(typeof d.owner==='string')owner=d.owner;if(typeof d.price_visible==='boolean')priceVisible=d.price_visible;if(Array.isArray(d.price_lists))allowed=d.price_lists.filter(x=>typeof x==='string');if(priorLists!==JSON.stringify(allowed))updateLists(allowed);el('catalog').classList.toggle('no-price',!priceVisible);el('openList').disabled=!allowed.length;el('message').textContent='Device authorized'+(owner?' · '+owner:'');
if(!selected||!allowed.includes(selected)){pick();if(!allowed.length)el('message').textContent='Tidak ada pricelist yang diizinkan. Hubungi admin.';flush();return;}
if(el('catalog').hidden){show('catalog');load(page);return;}if(priorOwner!==owner||priorPrice!==priceVisible||priorLists!==JSON.stringify(allowed)){load(1);return;}
if(requestAction==='stock'&&sentEpoch===epoch){if(!Array.isArray(d.items)||!Number.isInteger(d.page)||!Number.isInteger(d.pages)||!Number.isInteger(d.total)){clearRows('API belum mendukung pagination. Pasang backend V118.');pages=1;nav();return;}page=d.page;pages=d.pages;total=d.total;el('rows').replaceChildren();if(!d.items.length)clearRows('Produk tidak ditemukan.');for(const item of d.items){const tr=el('rows').insertRow();let c=tr.insertCell();text(c,'strong',item.product);text(c,'small',[item.code,item.brand,item.classification].filter(Boolean).join(' · '));text(tr,'td',new Intl.NumberFormat('id-ID').format(Number(item.stock??0)),'num');if(priceVisible){text(tr,'td',item.price==null?'-':new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:2}).format(Number(item.price)),'num price');}}el('info').textContent=total?`${(page-1)*Number(el('size').value)+1}–${(page-1)*Number(el('size').value)+d.items.length} dari ${total.toLocaleString('id-ID')} produk`:'0 produk';el('viewport').scrollTop=0;nav();}
flush();}
el('regForm').onsubmit=e=>{e.preventDefault();if(!busy){send('register',{name:el('name').value,code:el('code').value});el('code').value='';}};el('retry').onclick=()=>{needsStatus=true;flush()};el('priceForm').onsubmit=e=>{e.preventDefault();if(!active||!allowed.includes(el('price').value))return;selected=el('price').value;el('selectedList').textContent=selected;el('q').value='';show('catalog');load(1);};el('changeList').onclick=pick;
el('q').oninput=()=>{clearTimeout(timer);epoch++;pendingStock=false;clearRows('Mencari…');timer=setTimeout(()=>load(1),450);};el('size').onchange=()=>{clearTimeout(timer);load(1);};el('first').onclick=()=>load(1);el('prev').onclick=()=>load(page-1);el('next').onclick=()=>load(page+1);el('last').onclick=()=>load(pages);
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(timer);epoch++;pendingStock=false;clearRows();}else{show('waiting');el('stateTitle').textContent='Memeriksa akses…';el('message').textContent='Memeriksa perangkat…';needsStatus=true;flush();}});setInterval(()=>{if(!document.hidden){needsStatus=true;flush();}},30000);send('status');
</script></body></html>
